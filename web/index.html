<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Caveat:wght@600;700&family=Cinzel:wght@400;500;600;800&family=Inter:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg?v=4" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png?v=4" />
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%favicon-16.png?v=4" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png?v=4" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest?v=4" />
    <meta name="theme-color" content="#17402f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TCLOT" />
    <!-- viewport-fit=cover: required for env(safe-area-inset-*) to resolve on
         iOS, so the home-screen (standalone) app can pad the status bar and
         home-indicator areas. In-browser values stay 0, so no effect there. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>TCLOT — Tri-Continental League of Titans</title>
    <style>
      html, body {
        margin: 0;
        background-color: #121212;
      }
      body[data-tclot-theme='light'] {
        background-color: #f2f2f2;
      }
      body[data-tclot-theme='ceefax'] {
        background-color: #000000;
      }
      #root-loading-hint {
        margin: 0 auto;
        padding: 72px 16px 24px;
        max-width: 40rem;
      }
      .boot-row {
        display: grid;
        grid-template-columns: 22px minmax(0, 1fr) 40px 64px;
        gap: 12px;
        align-items: center;
        height: 46px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      body[data-tclot-theme='light'] .boot-row {
        border-bottom-color: rgba(0, 0, 0, 0.08);
      }
      .boot-row span {
        display: block;
        height: 10px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.14);
      }
      body[data-tclot-theme='light'] .boot-row span {
        background: rgba(0, 0, 0, 0.08);
      }
      .boot-row span:nth-child(2) { width: 42%; }
      .boot-row span:nth-child(4) { width: 72%; justify-self: end; }
    </style>
  </head>
  <body>
    <script>
      ;(function () {
        try {
          var s = localStorage.getItem('tclot-theme')
          var resolved =
            s === 'light' || s === 'dark' || s === 'ceefax'
              ? s
              : window.matchMedia &&
                  window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.body.dataset.tclotTheme = resolved
          var bg =
            resolved === 'light'
              ? '#f2f2f2'
              : resolved === 'ceefax'
                ? '#000000'
                : '#121212'
          document.documentElement.style.backgroundColor = bg
          document.body.style.backgroundColor = bg
        } catch (e) {
          document.body.dataset.tclotTheme = 'light'
          document.documentElement.style.backgroundColor = '#f2f2f2'
          document.body.style.backgroundColor = '#f2f2f2'
        }
      })()
    </script>
    <div id="root">
      <div id="root-loading-hint" aria-hidden="true">
        <div class="boot-row"><span></span><span></span><span></span><span></span></div>
        <div class="boot-row"><span></span><span></span><span></span><span></span></div>
        <div class="boot-row"><span></span><span></span><span></span><span></span></div>
        <div class="boot-row"><span></span><span></span><span></span><span></span></div>
        <div class="boot-row"><span></span><span></span><span></span><span></span></div>
        <div class="boot-row"><span></span><span></span><span></span><span></span></div>
        <div class="boot-row"><span></span><span></span><span></span><span></span></div>
        <div class="boot-row"><span></span><span></span><span></span><span></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
